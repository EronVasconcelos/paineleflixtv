<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PAINEL STREAM">
    
    <link rel="apple-touch-icon" href="https://i.postimg.cc/VNCzbyZV/favicon.png">

    <link rel="manifest" href="manifest.json">
    <title>PAINEL STREAM - Gerenciador Premium</title>

    <script>
      // 1. Registro Único do Service Worker (Caminho Absoluto para Vercel)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('Service Worker ativo!', reg.scope))
            .catch(err => console.error('Falha no SW:', err));
        });
      }

      // 2. Função para Ativar Notificações
      async function ativarNotificacoes() {
        if (!("Notification" in window)) {
          alert("Este navegador não suporta notificações.");
          return;
        }

        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          new Notification("PAINEL STREAM", {
            body: "Notificações ativadas com sucesso!",
            icon: "https://i.postimg.cc/VNCzbyZV/favicon.png"
          });
        } else {
          alert("Por favor, autorize as notificações nas configurações do seu navegador.");
        }
      }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {

    </script>

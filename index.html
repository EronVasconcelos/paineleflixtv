    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EFLIXTV">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @supports (padding: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); }
            .pt-safe { padding-top: env(safe-area-inset-top); }
        }
    </style>

    <script>
        // Safer shim for process.env
        if (!window.process) window.process = { env: {} };
        if (!window.process.env) window.process.env = {};
        // Default to empty string if not provided by host
        if (typeof window.process.env.API_KEY === 'undefined') {
            window.process.env.API_KEY = "";
        }
    </script>
